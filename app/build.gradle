plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.akin.wallet'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.akin.wallet"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"


    }

    // Release signing comes from local.properties (never committed):
    //   release.storeFile, release.storePassword, release.keyAlias, release.keyPassword
    // Without them the release build falls back to the debug key (local use only).
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    def hasReleaseKey = localProps.containsKey("release.storeFile")

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(localProps["release.storeFile"])
                storePassword localProps["release.storePassword"]
                keyAlias localProps["release.keyAlias"]
                keyPassword localProps["release.keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // AGP 9.3+ DSL: R8 code + resource optimization with the default
            // platform rules included. SQLCipher ships its own consumer rules.
            optimization {
                enable true
            }
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.biometric
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.sqlcipher
    implementation libs.androidx.sqlite

}